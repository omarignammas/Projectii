spring.application.name=backendProjecty

# Configuration PostgreSQL — env vars override these for Docker/Render, defaults keep local dev working
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectydb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Global REST URL
BaseUrl=/api/v1

# Keys JWT
application.security.jwt.SECRET_KEY=${JWT_SECRET_KEY:44d287b7ee4ad66875f28ee32b64b7ab5448901f36800fbaf3b6216d4479270c}
application.security.jwt.EXPIRATION=${JWT_EXPIRATION:86400000}

# PostgreSQL Config
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# File uploads (avatars)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# CORS — comma-separated list, set to the deployed frontend origin in production
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator — health check only, no other management endpoints exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# YouTube Data API v3 — used by playlist import. Leave the key blank to disable the
# feature gracefully (returns a clear "not configured" error instead of calling out).
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.base-url=${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}

# Google Gemini API — used for AI Focus Room session reports. Leave the key blank
# to disable the feature gracefully (reports just stay in a FAILED state, silently).
app.llm.api-key=${GEMINI_API_KEY:}
app.llm.base-url=${LLM_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.llm.model=${LLM_MODEL:gemini-2.0-flash}
