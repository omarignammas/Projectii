spring.application.name=backendProjecty

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/projectydb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=projectykeydb

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Global REST URL
BaseUrl=/api/v1

# Keys JWT
application.security.jwt.SECRET_KEY=44d287b7ee4ad66875f28ee32b64b7ab5448901f36800fbaf3b6216d4479270c
application.security.jwt.EXPIRATION=86400000

# PostgreSQL Config
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true