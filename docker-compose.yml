version: '3.8'

services:
  # Our Database
  postgres:
    image: postgres:15-alpine
    container_name: projecty-postgres
    environment:
      POSTGRES_DB: projectydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - projecty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Our Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projecty-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/projectydb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JWT_SECRET_KEY: 44d287b7ee4ad66875f28ee32b64b7ab5448901f36800fbaf3b6216d4479270c
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - projecty-network
    restart: unless-stopped

  # Our Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projecty-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - projecty-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  projecty-network:
    driver: bridge